services:
  postgres:
    image: postgres:16-alpine
    container_name: pe_example_db
    environment:
      POSTGRES_DB: pe_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pe_example"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/V1__create_tables.sql:/docker-entrypoint-initdb.d/01_tables.sql
      - ./seeds/V2__insert_initial_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql

volumes:
  pgdata:
