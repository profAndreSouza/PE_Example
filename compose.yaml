services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pe_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pe_example"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./banco_dados/migrations/V1__create_tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
      - ./banco_dados/seeds/V2__insert_initial_data.sql:/docker-entrypoint-initdb.d/02_seeds.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pe_example
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

  quality:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["quality"]
    working_dir: /work
    environment:
      BASE_URL: http://frontend
      API_URL: http://backend:8080/api
    volumes:
      - ./quality:/work
      - quality_node_modules:/work/node_modules
    command: sh -c "npm ci && npm test"
    depends_on:
      - backend
      - frontend

  backend-tests:
    image: maven:3.9.9-eclipse-temurin-21-alpine
    profiles: ["tests"]
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
    command: mvn --batch-mode test

volumes:
  pgdata:
  quality_node_modules:
  maven_cache:
